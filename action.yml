name: Arch deployment reporting
description: Report deployed PRs from your runner without granting Arch repository access.
inputs:
  arch-token:
    description: Arch admin-issued token for this deployment target.
    required: true
  api-url:
    description: Arch API origin provided by your admin.
    required: true
  github-token:
    description: Temporary token used only for GitHub API requests in this runner.
    default: ${{ github.token }}
  deployed-sha:
    description: Actual deployed commit. Inferred from deployment_status events, and in preview mode from the pull_request head.
  deployment-id:
    description: Stable identity of this deployment, reused for HTTP retries.
  deployed-at:
    description: Deployment completion time in ISO 8601, captured immediately after readiness.
  deployment-order:
    description: Numeric source ordering used to break equal completion timestamps.
  mode:
    description: deploy, refresh or preview. Refresh only updates the current deployment's coordination metadata. Preview reports one open PR's preview and never changes the current deployment.
    default: deploy
  preview-url:
    description: URL of the ready PR preview. Required in preview mode; must be one of the app's allowed origins.
outputs:
  report-id:
    description: Accepted deployment report identifier (deploy and refresh modes).
  app-url:
    description: Arch app URL.
runs:
  using: node24
  main: index.mjs
