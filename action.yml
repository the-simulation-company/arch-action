name: Arch deployment reporting
description: Report deployed PRs from your runner without granting Arch repository access.
inputs:
  arch-token:
    description: Arch admin-issued token for this deployment target.
    required: true
  github-token:
    description: Temporary token used only for GitHub API requests in this runner.
    default: ${{ github.token }}
  deployed-sha:
    description: Actual deployed commit. Inferred from deployment_status events, and in preview mode from the current labeled PR's deployment.
  deployment-id:
    description: Stable identity of this deployment, reused for HTTP retries.
  deployed-at:
    description: Deployment completion time in ISO 8601, captured immediately after readiness.
  deployment-order:
    description: Numeric source ordering used to break equal completion timestamps.
  mode:
    description: deploy, refresh or preview. Refresh only updates the current deployment's coordination metadata. Preview reports a ready open PR with the arch-qa label and never changes the current deployment.
    default: deploy
  preview-url:
    description: Ready preview URL for direct workflow calls. Otherwise inferred from GitHub deployment statuses; must be one of the app's allowed origins.
  preview-environment:
    description: GitHub deployment environment used for automatic PR previews.
    default: Preview
outputs:
  report-id:
    description: Accepted deployment report identifier (deploy and refresh modes).
  app-url:
    description: Arch app URL.
runs:
  using: node24
  main: index.mjs
